<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversación Compartida - MOMENTOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        }
        .message-bubble { 
            max-width: 85%; 
            padding: 10px 14px; 
            border-radius: 18px; 
            margin-bottom: 6px; 
            word-wrap: break-word; 
        }
        .message-mine { 
            background-color: #10B981; 
            margin-left: auto; 
            border-bottom-right-radius: 4px; 
        }
        .message-other { 
            background-color: #262626; 
            margin-right: auto; 
            border-bottom-left-radius: 4px; 
        }
        .app-header { 
            background: rgba(0,0,0,0.85); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid #1f1f1f; 
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">
    <!-- Header Fijo -->
    <header class="app-header flex items-center justify-between p-4 sticky top-0 z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center font-bold text-lg shadow-lg">M</div>
            <div>
                <h1 class="font-bold text-lg leading-tight tracking-wide">MOMENTOS</h1>
                <p class="text-xs text-emerald-400 font-medium">Conversación Compartida</p>
            </div>
        </div>
        <div class="bg-gray-800 text-xs px-2 py-1 rounded text-gray-300 border border-gray-700">
            Solo lectura
        </div>
    </header>

    <!-- Contenedor de Chat -->
    <main class="flex-1 overflow-y-auto p-4 flex flex-col gap-2 pb-12" id="chat-container">
        <div class="flex h-full items-center justify-center flex-col text-gray-500">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-emerald-500 mb-4"></div>
            <p class="animate-pulse">Cargando conversación...</p>
        </div>
    </main>

    <!-- Lógica de Decodificación y Renderizado -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let payload = window.location.hash.substring(1); // Intentar obtener desde #
            
            if (!payload) {
                // Si no hay hash, intentar obtener desde el pathname (ej. /shared_chat_offline/PAYLOAD)
                const pathParts = window.location.pathname.split('/');
                payload = pathParts[pathParts.length - 1];
            }

            if (!payload || payload === "index.html" || payload === "") {
                showError("Enlace inválido o incompleto. Asegúrate de copiar el enlace completo.");
                return;
            }

            try {
                // 1. Decodificar Base64 URL-Safe
                let base64 = payload.replace(/-/g, '+').replace(/_/g, '/');
                while (base64.length % 4) { base64 += '='; }
                const binaryString = atob(base64);
                
                // 2. Convertir a Array de Bytes
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                // 3. Descomprimir usando GZIP (pako)
                const decompressed = pako.ungzip(bytes, { to: 'string' });
                
                // 4. Parsear JSON
                const data = JSON.parse(decompressed);

                // 5. Validar que no haya expirado (24 horas)
                const now = Date.now();
                if (now - data.createdAt > 86400000) {
                    showError("Esta conversación compartida ya no está disponible.<br><br>Los enlaces expiran automáticamente después de 24 horas por privacidad.");
                    return;
                }

                // 6. Renderizar mensajes
                renderMessages(data.messages);

            } catch (error) {
                console.error("Error decodificando el enlace:", error);
                showError("Enlace corrupto o modificado. No se pudo leer la conversación.");
            }
        });

        function showError(msg) {
            const container = document.getElementById("chat-container");
            container.innerHTML = `
                <div class="flex h-full items-center justify-center flex-col text-center px-6">
                    <div class="bg-gray-900 p-4 rounded-full mb-4 border border-gray-800">
                        <svg class="w-10 h-10 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    </div>
                    <h2 class="text-xl font-bold mb-2">Página no encontrada</h2>
                    <p class="text-gray-400 text-sm leading-relaxed">${msg}</p>
                </div>
            `;
        }

        function renderMessages(messages) {
            const container = document.getElementById("chat-container");
            container.innerHTML = "";

            if (!messages || messages.length === 0) {
                showError("No hay mensajes en esta conversación para mostrar.");
                return;
            }

            // Identificamos los diferentes remitentes.
            // Asumiremos que el que envió el primer mensaje es el "creador" u otro, 
            // solo para diferenciar los colores en pantalla (burbuja verde vs gris).
            const senders = [...new Set(messages.map(m => m.senderId))];
            const primarySender = senders[0]; 

            const dateNotice = document.createElement('div');
            dateNotice.className = "text-center text-xs text-gray-500 my-4 uppercase tracking-widest font-semibold";
            dateNotice.innerText = "Mensajes de Hoy";
            container.appendChild(dateNotice);

            messages.forEach(msg => {
                const date = new Date(msg.timestamp);
                const timeStr = date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                const isMine = msg.senderId === primarySender;
                
                const wrapper = document.createElement('div');
                wrapper.className = `flex flex-col w-full ${isMine ? 'items-end' : 'items-start'}`;

                const bubble = document.createElement('div');
                bubble.className = `message-bubble ${isMine ? 'message-mine text-white shadow-md' : 'message-other text-gray-200 shadow-md'}`;
                
                const text = document.createElement('div');
                text.className = "text-[15px] leading-snug";
                text.innerText = msg.text;
                
                const time = document.createElement('div');
                time.className = `text-[10px] mt-1 text-right font-medium ${isMine ? 'text-emerald-100/80' : 'text-gray-500'}`;
                time.innerText = timeStr;

                bubble.appendChild(text);
                bubble.appendChild(time);
                wrapper.appendChild(bubble);
                container.appendChild(wrapper);
            });
            
            // Auto scroll al final de la página
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
